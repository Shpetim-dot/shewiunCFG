name: CFA quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CFA_POSTS_PER_MINUTE: "10000"  # shared in-memory limiter must not couple independent tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - name: API, runtime and website tests (SQLite)
        run: python -m pytest -q --import-mode=importlib --ignore=test_mobile.py

  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: cfa
          POSTGRES_DB: cfa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      CFA_DATABASE_URL: postgresql://postgres:cfa@localhost:5432/cfa
      CFA_DB_SCHEMA_FROM_PATH: "1"
      CFA_POSTS_PER_MINUTE: "10000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Same suite on PostgreSQL
        run: python -m pytest -q --ignore=test_mobile.py
      - name: SQLite-to-PostgreSQL migration rehearsal
        run: |
          set -eu
          tmp="$(mktemp -d)"
          src="$tmp/source.db"
          env -u CFA_DATABASE_URL -u CFA_DB_SCHEMA_FROM_PATH -u CFA_PG_SCHEMA CFA_DATABASE_PATH="$src" python - <<'PY'
          from datetime import datetime, timezone
          from app import auth, cfa_core as pf, main

          main.init_db()
          now = datetime.now(timezone.utc).isoformat()
          with auth.db() as con:
              con.execute(
                  "INSERT INTO orgs (id,name,slug,created_at,updated_at) VALUES (?,?,?,?,?)",
                  ("default", "Migration rehearsal", "migration-rehearsal", now, now),
              )
          with pf.db() as con:
              con.execute(
                  "INSERT INTO notes (id,title,body,kind,status,owner,source,created_at,updated_at,space,flags,org_id) "
                  "VALUES (?,?,?,?,?,?,?,?,?,?,?,?)",
                  ("migration-note", "Migration rehearsal", "preserve this row", "note", "verified",
                   "ci", "migration-test", now, now, "shared", "[]", "default"),
              )
              con.execute(
                  "INSERT INTO mcp_servers (id,name,url,token_enc,tools,created_by,created_at,org_id) "
                  "VALUES (?,?,?,?,?,?,?,?)",
                  ("migration-server", "Migration server", "https://mcp.example.test/mcp", "encrypted-test-token",
                   "[]", "ci", now, "default"),
              )
              con.commit()
          PY
          python tools/sqlite_to_postgres.py --sqlite "$src" --schema ci_migration


  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt playwright && python -m playwright install --with-deps chromium
      - name: Phone, tablet and desktop layouts in a real browser
        run: python -m pytest -q --import-mode=importlib test_mobile.py

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit && pip-audit -r requirements.txt
