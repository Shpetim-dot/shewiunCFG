services:
  - type: web
    name: shewiun-cfa
    runtime: docker
    plan: starter          # a disk requires the starter plan
    healthCheckPath: /api/health/ready
    autoDeploy: true
    disk:
      name: cfa-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: CFA_ENV
        value: production
      - key: CFA_DATABASE_PATH
        value: /data/cfa.db
      - key: CFA_ALLOW_SIGNUP
        value: "1"          # first start only, then set to 0
      - key: CFA_SECRET_KEY
        sync: false         # paste a Fernet key (see docs/BILLING.md)
      - key: CFA_BILLING
        value: "off"
